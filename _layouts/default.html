<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ site.description }}">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <header>
    <h1>
      <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
    </h1>
    <nav>
      <a href="{{ '/technical/' | relative_url }}" {% if page.category == 'technical' %}class="active"{% endif %}>Technical</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.title == 'About' %}class="active"{% endif %}>About</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    {% if page.layout == 'home' %}
      <div class="subscribe">
        <strong>Stay updated:</strong> Subscribe <a href="{{ '/feed.xml' | relative_url }}">via RSS</a>
      </div>
      <p>{{ site.description }}</p>
    {% endif %}
  </footer>
</body>
</html>
