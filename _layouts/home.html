---
layout: default
---

<section class="posts-section">
  <h2>Recent Posts</h2>
  <ul class="posts-list">
    {% for post in site.posts %}
      <li class="post-item">
        <span class="post-date">{{ post.date | date: "%b %d, %Y" }}</span>
        <h3 class="post-title">
          <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
        </h3>
        {% if post.excerpt %}
          <p>{{ post.excerpt | strip_html | truncatewords: 30 }}</p>
        {% endif %}
      </li>
    {% endfor %}
  </ul>
</section>
