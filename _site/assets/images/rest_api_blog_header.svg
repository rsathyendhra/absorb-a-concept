    <text x="560" y="285" text-anchor="middle" style="font-size: 12px; color: var(--color-text-secondary);;fill:rgb(194, 192, 182);stroke:none;color:rgb(194, 192, 182);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">URIs</text>
